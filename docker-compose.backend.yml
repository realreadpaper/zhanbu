services:
  db:
    image: postgres:16-alpine
    container_name: zhanbu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zhanbu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zhanbu_secret}
      POSTGRES_DB: ${DB_NAME:-zhanbu}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zhanbu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zhanbu} -d ${DB_NAME:-zhanbu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zhanbu-api
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      ZHANBU_SERVER_PORT: 8080
      ZHANBU_SERVER_MODE: release
      ZHANBU_DB_HOST: db
      ZHANBU_DB_PORT: 5432
      ZHANBU_DB_USER: ${DB_USER:-zhanbu}
      ZHANBU_DB_PASSWORD: ${DB_PASSWORD:-zhanbu_secret}
      ZHANBU_DB_NAME: ${DB_NAME:-zhanbu}
      ZHANBU_DB_SSLMODE: disable
      ZHANBU_JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-secret}
      ZHANBU_AI_PROVIDER: ${AI_PROVIDER:-openai}
      ZHANBU_AI_API_KEY: ${AI_API_KEY:-}
      ZHANBU_AI_MODEL: ${AI_MODEL:-gpt-4}
      ZHANBU_AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      ZHANBU_AI_MAX_TOKENS: ${AI_MAX_TOKENS:-5000}
      ZHANBU_AI_TEMPERATURE: ${ZHANBU_AI_TEMPERATURE:-0.7}
      ZHANBU_BCRYPT_COST: ${ZHANBU_BCRYPT_COST:-8}
      ZHANBU_CORS_ALLOWED_ORIGINS: ${ZHANBU_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ZHANBU_SECURITY_VERIFY_EMAIL: ${ZHANBU_SECURITY_VERIFY_EMAIL:-false}
      ZHANBU_SMTP_ENABLED: ${ZHANBU_SMTP_ENABLED:-false}
      ZHANBU_SMTP_HOST: ${ZHANBU_SMTP_HOST:-}
      ZHANBU_SMTP_PORT: ${ZHANBU_SMTP_PORT:-465}
      ZHANBU_SMTP_USERNAME: ${ZHANBU_SMTP_USERNAME:-}
      ZHANBU_SMTP_PASSWORD: ${ZHANBU_SMTP_PASSWORD:-}
      ZHANBU_SMTP_FROM: ${ZHANBU_SMTP_FROM:-}
      ZHANBU_LIUYAO_VERSION: ${ZHANBU_LIUYAO_VERSION:-v2}
      ZHANBU_LIUYAO_METHOD: ${ZHANBU_LIUYAO_METHOD:-both}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zhanbu-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:

networks:
  zhanbu-network:
